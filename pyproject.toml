[tool.poetry]
name = "django-s3-upload-multipart"
version = "1.4.1"
description = "Direct-to-S3 client-side uploads for Django with multipart support, pause/resume, and file management APIs."
authors = ["Sahil Asopa <hello@zerobuffer.io>"]
license = "MIT"
maintainers = ["Sahil Asopa <hello@zerobuffer.io>"]
readme = "README.md"
homepage = "https://github.com/sahilasopa/django-s3-upload-multipart"
repository = "https://github.com/sahilasopa/django-s3-upload-multipart"
documentation = "https://github.com/sahilasopa/django-s3-upload-multipart"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 2.0",
    "Framework :: Django :: 2.1",
    "Framework :: Django :: 2.2",
    "Framework :: Django :: 3.0",
    "Framework :: Django :: 3.1",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{ include = "s3upload" }]
exclude = ["s3upload/src/node_modules/**"]

[tool.poetry.dependencies]
python = ">=3.7"
django = ">=2.0"
boto3 = ">=1.14"

[tool.poetry.group.test.dependencies]
coverage = "*"
pytest = "*"
pytest-cov = "*"
pytest-django = "*"
tox = "*"

[tool.poetry.group.dev.dependencies]
coverage = "*"
mypy = "*"
pre-commit = "*"
ruff = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
